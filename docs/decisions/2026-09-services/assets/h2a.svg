<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">H2a — organiser le travail humain–agent</title><desc id="desc">Vue fonctionnelle : coordonner le travail, vérifier les résultats et rendre les décisions discutables.. Les flèches représentent un parcours de travail, pas une intégration automatique de toutes les briques.
Sources : documentations locales H2a, Harness et Focus · Schéma éditorial, septembre 2026.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50758c"/></marker></defs>
<rect width="1200" height="760" rx="20" fill="#f3f7fa"/>
<text x="48" y="62" font-family="sans-serif" font-size="30" font-weight="700" fill="#12344b">H2a — organiser le travail humain–agent</text>
<text x="48" y="98" font-family="sans-serif" font-size="17" fill="#476477">Vue fonctionnelle : coordonner le travail, vérifier les résultats et rendre les décisions discutables.</text>
