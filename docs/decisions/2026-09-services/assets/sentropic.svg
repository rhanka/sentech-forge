<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Sentropic — trois responsabilités distinctes</title><desc id="desc">Le parcours des appels aux modèles et le contexte des serveurs / postes sont deux sujets différents.. Cluster mesh ne figure pas comme un saut du trafic LLM. Ce schéma ne revendique aucune fédération livrée.
Sources : README cluster-mesh, llm-mesh, llm-gateway · Schéma éditorial, septembre 2026.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50758c"/></marker></defs>
<rect width="1200" height="760" rx="20" fill="#f3f7fa"/>
<text x="48" y="62" font-family="sans-serif" font-size="30" font-weight="700" fill="#12344b">Sentropic — trois responsabilités distinctes</text>
<text x="48" y="98" font-family="sans-serif" font-size="17" fill="#476477">Le parcours des appels aux modèles et le contexte des serveurs / postes sont deux sujets différents.</text>
<path d="M268,218 L330,218" fill="none" stroke="#50758c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M715,230 L790,230" fill="none" stroke="#50758c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M970,330 L970,410" fill="none" stroke="#50758c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="980.0" y="361.0" font-family="sans-serif" font-size="13" fill="#476477">exécution</text>
<rect x="48" y="150" width="220" height="130" rx="12" fill="#e0eff7" stroke="#c7d7e0"/>
<text x="68" y="184" font-family="sans-serif" font-size="20" font-weight="700" fill="#12344b">Applications</text>
<text x="68" y="215" font-family="sans-serif" font-size="16" fill="#34566b">Assistants et produits</text>
<text x="68" y="240" font-family="sans-serif" font-size="16" fill="#34566b">Clients autorisés</text>
<rect x="330" y="150" width="385" height="180" rx="12" fill="#ffffff" stroke="#c7d7e0"/>
<text x="350" y="184" font-family="sans-serif" font-size="20" font-weight="700" fill="#12344b">LLM gateway</text>
<text x="350" y="215" font-family="sans-serif" font-size="16" fill="#34566b">Authentification et autorisation</text>
<text x="350" y="240" font-family="sans-serif" font-size="16" fill="#34566b">Quotas, mesure, formats API</text>
<text x="350" y="265" font-family="sans-serif" font-size="16" fill="#34566b">Exécution du plan de routage</text>
<rect x="790" y="150" width="362" height="180" rx="12" fill="#ffffff" stroke="#c7d7e0"/>
<text x="810" y="184" font-family="sans-serif" font-size="20" font-weight="700" fill="#12344b">LLM mesh</text>
<text x="810" y="215" font-family="sans-serif" font-size="16" fill="#34566b">Éligibilité, routage et santé</text>
<text x="810" y="240" font-family="sans-serif" font-size="16" fill="#34566b">Affinité et accès fournisseurs</text>
<text x="810" y="265" font-family="sans-serif" font-size="16" fill="#34566b">Plans opaques pour la gateway</text>
<rect x="790" y="410" width="362" height="125" rx="12" fill="#ffffff" stroke="#c7d7e0"/>
<text x="810" y="444" font-family="sans-serif" font-size="20" font-weight="700" fill="#12344b">Fournisseurs / runtimes</text>
<text x="810" y="475" font-family="sans-serif" font-size="16" fill="#34566b">Exécution des requêtes</text>
<text x="810" y="500" font-family="sans-serif" font-size="16" fill="#34566b">Réponses et événements</text>
<rect x="48" y="410" width="667" height="205" rx="12" fill="#fff3dc" stroke="#c7d7e0"/>
<text x="68" y="444" font-family="sans-serif" font-size="20" font-weight="700" fill="#12344b">Cluster mesh · contexte distinct</text>
<text x="68" y="475" font-family="sans-serif" font-size="16" fill="#34566b">Serveur local et postes rattachés</text>
<text x="68" y="500" font-family="sans-serif" font-size="16" fill="#34566b">Identités et références signées ; frontières de tenant</text>
<text x="68" y="525" font-family="sans-serif" font-size="16" fill="#34566b">Runtime documenté : serveur unique</text>
<text x="68" y="550" font-family="sans-serif" font-size="16" fill="#34566b">Fédération interserveurs : capacité future, désactivée</text>
<text x="48" y="700" font-family="sans-serif" font-size="14" fill="#476477">Cluster mesh ne figure pas comme un saut du trafic LLM. Ce schéma ne revendique aucune fédération livrée.</text>
<text x="48" y="724" font-family="sans-serif" font-size="14" fill="#476477">Sources : README cluster-mesh, llm-mesh, llm-gateway · Schéma éditorial, septembre 2026.</text>
